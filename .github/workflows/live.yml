name: Live YNAB (read-only)
# Runs the generated suite's read-only live cases against the real API.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ynab-live
  cancel-in-progress: false
jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ynab-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install locked dependencies without secrets
        run: uv sync --locked
      - name: Read-only live cases
        env:
          YNAB_E2E_LIVE: '1'
          YNAB_BEARER: ${{ secrets.YNAB_ACCESS_TOKEN }}
        run: uv run pytest -q -k live
