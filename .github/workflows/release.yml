name: Release (legacy ynab-api-cli)
# Publishes the final, deprecated ynab-api-cli release from the legacy/ynab-api-cli branch.
# The maintained package is codapact-ynab, released from main.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-legacy
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/legacy/ynab-api-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run poe check
      - run: uv build
      - run: uvx --from twine==6.2.0 twine check --strict dist/*.whl dist/*.tar.gz
      - run: uv run poe distribution-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ynab-api-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
