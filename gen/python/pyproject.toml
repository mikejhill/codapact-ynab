[project]
name = "codapact-ynab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["codapact[keyring]>=0.17.3,<0.18"]

[project.scripts]
codapact-ynab = "codapact_ynab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.1,<0.14"]
build-backend = "uv_build"
