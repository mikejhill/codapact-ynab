version: 1
source:
  type: openapi
  path: openapi.yaml
  upstream: https://api.ynab.com/papi/open_api_spec.yaml   # codapact sync / sync --check
shape:
  - group: {by: tag}
  - defaults:
      params: {"*.plan_id": last-used}
cli:
  # program defaults to the distribution: codapact-ynab
  previous_programs: [ynab]   # saved logins and settings from 0.2.0 carry over
  env_prefix: YNAB            # keep YNAB_BEARER, YNAB_BASE_URL, ...
  auth:
    bearer:
      docs: >-
        Create a personal access token in YNAB under Account Settings > Developer Settings
        (https://app.ynab.com/settings/developer). It grants full access to your budgets.
      check: get_user   # doctor's signed-in call (login: bearer row)
  skill:   # agent skill shipped in the package: codapact-ynab skill install --dir DIR
    api_name: YNAB
    description: >-
      Read and change YNAB plans, accounts, categories, months, payees, scheduled
      transactions, and transactions through the `codapact-ynab` CLI. Use when the user
      asks about their YNAB budget, balances, category funding, or spending, or wants to
      add, edit, import, or schedule transactions.
readme:
  name: YNAB API
  docs: https://api.ynab.com/
  repository: mikejhill/codapact-ynab
  examples:
    - plans list
    - accounts list -o table
    - "transactions list --since-date 2026-01-01 --query 'data.transactions[].payee_name'"
  sections:
    - title: Notes
      body: |
        `--plan-id` defaults to `last-used`. `--dry-run` prints the HTTP request without
        sending it; commands that delete ask for confirmation (or `--yes`).

        Upgrading from 0.2.0, where the command was `ynab`: a login saved with
        `ynab auth login` and settings in `~/.config/ynab/` are picked up automatically.
        `codapact-ynab` replaces `ynab-api-cli`, which is no longer maintained.
targets:
  - {name: python, output: gen/python, options: {package: codapact_ynab, distribution: codapact-ynab}}
  - {name: python-cli, output: gen/python}
  - {name: python-readme, output: .}
