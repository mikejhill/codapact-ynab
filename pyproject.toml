# Hand-written packaging for the YNAB coda. The code itself lives in gen/python and is
# regenerated by Codapact (see codapact.yaml); release-please bumps the version here only.
[project]
name = "codapact-ynab"
version = "0.3.0"
description = "Typed Python client and `codapact-ynab` CLI for the YNAB API, generated by Codapact"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Hill" }]
requires-python = ">=3.13"
dependencies = ["codapact[keyring]>=0.9.0,<0.10"]
keywords = ["ynab", "budget", "cli", "api-client", "codapact"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
codapact-ynab = "codapact_ynab.cli:main"

[project.urls]
Homepage = "https://github.com/mikejhill/codapact-ynab"
Repository = "https://github.com/mikejhill/codapact-ynab"
Issues = "https://github.com/mikejhill/codapact-ynab/issues"
Generator = "https://github.com/mikejhill/codapact"

[dependency-groups]
dev = ["codapact[keyring]==0.9.0", "pytest>=8"]

[tool.uv.build-backend]
module-name = "codapact_ynab"
module-root = "gen/python/src"
source-include = ["gen/python/tests/**", "codapact.yaml", "openapi.yaml"]

[tool.pytest.ini_options]
testpaths = ["gen/python/tests"]

[build-system]
requires = ["uv_build>=0.11.1,<0.13"]
build-backend = "uv_build"
